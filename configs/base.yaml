project:
  name: hull-alpha-forecasting-allocation
  seed: 42
data:
  competition: hull-tactical-market-prediction
  source_url: https://www.kaggle.com/competitions/hull-tactical-market-prediction/data
  raw_dir: data/raw
  train_file: train.csv
  test_file: test.csv
  manifest_file: download_manifest.json
  date_column: date_id
  target: market_forward_excess_returns
  outcome_columns: [forward_returns, risk_free_rate, market_forward_excess_returns]
